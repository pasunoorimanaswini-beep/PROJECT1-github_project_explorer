<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Project Explorer</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config = { darkMode: "class" };</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

/* ---------- constants & helpers ---------- */
const LANGS = ["", "JavaScript", "TypeScript", "Python", "Java", "Go", "Rust", "C++", "C#", "PHP", "Ruby", "Kotlin", "Swift", "Dart"];
const PALETTE = ["#6366f1", "#10b981", "#f59e0b", "#ef4444", "#06b6d4", "#a855f7", "#94a3b8"];
const cache = new Map(); // in-memory cache: same URL is never fetched twice

const ls = {
  get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const fmt = (n) => (n >= 1000 ? (n / 1000).toFixed(1) + "k" : n);
const daysAgo = (n) => new Date(Date.now() - n * 864e5).toISOString().slice(0, 10);

// Debounce: returns the value only after the user stops changing it for `ms`
function useDebounce(value, ms) {
  const [v, setV] = useState(value);
  useEffect(() => { const t = setTimeout(() => setV(value), ms); return () => clearTimeout(t); }, [value, ms]);
  return v;
}

// One place that talks to the GitHub REST API (with cache + friendly errors)
async function gh(url, token) {
  if (cache.has(url)) return cache.get(url);
  const res = await fetch(url, {
    headers: { Accept: "application/vnd.github+json", ...(token ? { Authorization: "Bearer " + token } : {}) },
  });
  if (!res.ok) {
    if (res.status === 403 || res.status === 429) throw new Error("GitHub rate limit reached. Wait a minute or add a token.");
    if (res.status === 422) throw new Error("Invalid search. Try different filters.");
    throw new Error("GitHub error " + res.status);
  }
  const out = { data: await res.json(), remaining: res.headers.get("x-ratelimit-remaining") };
  cache.set(url, out);
  return out;
}

/* ---------- Chart.js wrapper ---------- */
function ChartBox({ title, type, labels, data }) {
  const ref = useRef();
  useEffect(() => {
    const c = new Chart(ref.current, {
      type,
      data: { labels, datasets: [{ label: title, data, backgroundColor: type === "doughnut" ? PALETTE : "#6366f1" }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: type === "doughnut", position: "bottom" } } },
    });
    return () => c.destroy(); // avoid "canvas already in use" errors on re-render
  }, [type, labels.join("|"), data.join("|")]);
  return (
    <div className="rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 p-3">
      <h3 className="text-sm font-semibold mb-2">{title}</h3>
      <div className="h-56"><canvas ref={ref} /></div>
    </div>
  );
}

/* ---------- Repo card ---------- */
function Card({ r, saved, note, onToggle, onNote, onTopic, onDetails }) {
  return (
    <div className="rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 p-4 flex flex-col gap-2">
      <div className="flex justify-between gap-2">
        <a href={r.html_url} target="_blank" rel="noreferrer" className="font-semibold text-indigo-600 dark:text-indigo-400 break-all hover:underline">{r.full_name}</a>
        <button onClick={onToggle} title={saved ? "Remove bookmark" : "Bookmark"} className="text-xl leading-none text-amber-500">{saved ? "★" : "☆"}</button>
      </div>
      <p className="text-sm text-slate-600 dark:text-slate-300 line-clamp-3">{r.description || "No description"}</p>
      <div className="flex flex-wrap gap-3 text-xs text-slate-500 dark:text-slate-400">
        <span>⭐ {fmt(r.stargazers_count)}</span><span>🍴 {fmt(r.forks_count)}</span>
        <span>🐞 {r.open_issues_count}</span><span>{r.language || "—"}</span>
        <span>Updated {new Date(r.updated_at).toLocaleDateString()}</span>
      </div>
      <div className="flex flex-wrap gap-1">
        {(r.topics || []).slice(0, 4).map((t) => (
          <button key={t} onClick={() => onTopic(t)} className="px-2 py-0.5 rounded-full text-xs bg-indigo-50 dark:bg-indigo-900/40 text-indigo-700 dark:text-indigo-300">{t}</button>
        ))}
      </div>
      <button onClick={onDetails} className="self-start text-xs text-indigo-600 dark:text-indigo-400 hover:underline">📊 View contributors</button>
      {saved && (
        <textarea value={note} onChange={(e) => onNote(e.target.value)} placeholder="Your notes about this repo..."
          className="mt-1 w-full text-sm rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent p-2" rows={2} />
      )}
    </div>
  );
}

/* ---------- Details popup: contributors chart ---------- */
function Details({ r, token, onClose }) {
  const [c, setC] = useState(null), [e, setE] = useState("");
  useEffect(() => {
    gh(`https://api.github.com/repos/${r.full_name}/contributors?per_page=10`, token)
      .then(({ data }) => setC(Array.isArray(data) ? data : []))
      .catch((x) => setE(x.message));
  }, [r.full_name]);
  return (
    <div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4" onClick={onClose}>
      <div className="w-full max-w-2xl rounded-xl bg-white dark:bg-slate-800 p-4 space-y-3" onClick={(ev) => ev.stopPropagation()}>
        <div className="flex justify-between items-center">
          <h2 className="font-bold break-all">{r.full_name}</h2>
          <button onClick={onClose} className="text-lg px-2">✕</button>
        </div>
        {e && <p className="text-sm text-red-500">{e}</p>}
        {!c && !e && <p className="text-sm text-slate-500">Loading contributors...</p>}
        {c && c.length === 0 && <p className="text-sm text-slate-500">No contributor data available.</p>}
        {c && c.length > 0 && <ChartBox title="Top 10 contributors (commits)" type="bar" labels={c.map((x) => x.login)} data={c.map((x) => x.contributions)} />}
      </div>
    </div>
  );
}

/* ---------- Main app ---------- */
function App() {
  const [q, setQ] = useState(""), [lang, setLang] = useState(""), [topic, setTopic] = useState("");
  const [sort, setSort] = useState("stars"), [days, setDays] = useState(0), [page, setPage] = useState(1);
  const [minStars, setMinStars] = useState(1000), [engOnly, setEngOnly] = useState(true);
  const [detail, setDetail] = useState(null);
  const [res, setRes] = useState({ items: [], total: 0 }), [loading, setLoading] = useState(false);
  const [err, setErr] = useState(""), [rem, setRem] = useState(null), [tab, setTab] = useState("explore");
  const [bm, setBm] = useState(() => ls.get("gpe_bm", {}));
  const [dark, setDark] = useState(() => ls.get("gpe_dark", false));
  const [token, setToken] = useState(() => ls.get("gpe_tok", ""));

  const dq = useDebounce(q, 500), dt = useDebounce(topic, 500), dtok = useDebounce(token, 800);

  useEffect(() => { document.documentElement.classList.toggle("dark", dark); ls.set("gpe_dark", dark); }, [dark]);
  useEffect(() => { ls.set("gpe_bm", bm); }, [bm]);
  useEffect(() => { ls.set("gpe_tok", token); }, [token]);

  // Build the GitHub Search query from all filters
  const url = useMemo(() => {
    const p = [];
    if (dq.trim()) p.push(dq.trim());
    if (lang) p.push("language:" + lang);
    if (dt.trim()) p.push("topic:" + dt.trim().toLowerCase().replace(/\s+/g, "-"));
    if (minStars) p.push("stars:>" + minStars); // only well-known repos
    if (days) p.push("created:>" + daysAgo(days)); // optional: only recently created repos
    if (!p.length) p.push("stars:>1000");
    return `https://api.github.com/search/repositories?q=${encodeURIComponent(p.join(" "))}&sort=${sort}&order=desc&per_page=18&page=${page}`;
  }, [dq, lang, dt, sort, days, page, minStars]);

  // Fetch whenever the URL changes; `live` flag ignores stale responses
  useEffect(() => {
    let live = true;
    setLoading(true); setErr("");
    gh(url, dtok)
      .then(({ data, remaining }) => { if (live) { setRes({ items: data.items, total: data.total_count }); setRem(remaining); } })
      .catch((e) => live && setErr(e.message))
      .finally(() => live && setLoading(false));
    return () => { live = false; };
  }, [url, dtok]);

  // Hide repos whose description contains Chinese/Japanese/Korean characters
  const CJK = /[\u3040-\u30ff\u3400-\u9fff\uac00-\ud7af]/;
  const shown = tab === "explore"
    ? res.items.filter((r) => !engOnly || !CJK.test(r.description || ""))
    : Object.values(bm).map((x) => x.repo);

  // Chart data derived from whatever list is on screen
  const charts = useMemo(() => {
    const counts = {};
    shown.forEach((r) => { const l = r.language || "Unknown"; counts[l] = (counts[l] || 0) + 1; });
    const langs = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 6);
    const top = (key) => [...shown].sort((a, b) => b[key] - a[key]).slice(0, 8);
    const s = top("stargazers_count"), i = top("open_issues_count");
    return {
      langs: [langs.map((x) => x[0]), langs.map((x) => x[1])],
      stars: [s.map((r) => r.name), s.map((r) => r.stargazers_count)],
      issues: [i.map((r) => r.name), i.map((r) => r.open_issues_count)],
    };
  }, [shown]);

  const toggle = (r) => setBm((b) => { const n = { ...b }; n[r.full_name] ? delete n[r.full_name] : (n[r.full_name] = { repo: r, note: "" }); return n; });
  const setNote = (name, note) => setBm((b) => ({ ...b, [name]: { ...b[name], note } }));
  const f = (setter) => (e) => { setter(e.target.value); setPage(1); };
  const inp = "rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 px-3 py-2 text-sm";

  return (
    <div className="max-w-6xl mx-auto p-4 space-y-4">
      {detail && <Details r={detail} token={dtok} onClose={() => setDetail(null)} />}
      <header className="flex flex-wrap items-center justify-between gap-2">
        <h1 className="text-2xl font-bold">🔭 GitHub Project Explorer</h1>
        <div className="flex items-center gap-3 text-xs">
          {rem !== null && <span className="px-2 py-1 rounded bg-slate-200 dark:bg-slate-700">API calls left: {rem}</span>}
          <button onClick={() => setDark(!dark)} className="px-3 py-1 rounded bg-slate-200 dark:bg-slate-700">{dark ? "☀ Light" : "🌙 Dark"}</button>
        </div>
      </header>

      <div className="grid gap-2 sm:grid-cols-2 lg:grid-cols-6">
        <input className={inp + " lg:col-span-2"} placeholder="Search repositories..." value={q} onChange={f(setQ)} />
        <select className={inp} value={lang} onChange={f(setLang)}>{LANGS.map((l) => <option key={l} value={l}>{l || "All languages"}</option>)}</select>
        <input className={inp} placeholder="Topic tag (e.g. react)" value={topic} onChange={f(setTopic)} />
        <select className={inp} value={sort} onChange={f(setSort)}>
          <option value="stars">Sort: Stars</option><option value="forks">Sort: Forks</option><option value="updated">Sort: Recently updated</option>
        </select>
        <select className={inp} value={days} onChange={(e) => { setDays(+e.target.value); setPage(1); }}>
          <option value={7}>Created: last 7 days</option><option value={30}>Last 30 days</option><option value={365}>Last year</option><option value={0}>All time</option>
        </select>
      </div>
      <div className="flex flex-wrap items-center gap-3">
        <select className={inp} value={minStars} onChange={(e) => { setMinStars(+e.target.value); setPage(1); }}>
          <option value={0}>Any stars</option><option value={100}>100+ stars</option><option value={1000}>1,000+ stars</option>
          <option value={10000}>10,000+ stars</option><option value={50000}>50,000+ stars</option>
        </select>
        <label className="flex items-center gap-2 text-sm">
          <input type="checkbox" checked={engOnly} onChange={(e) => setEngOnly(e.target.checked)} /> English descriptions only
        </label>
        <input type="password" className={inp + " w-full sm:w-80"} placeholder="Optional GitHub token (higher rate limit)" value={token} onChange={(e) => setToken(e.target.value)} />
      </div>

      <nav className="flex gap-2">
        {[["explore", "Explore"], ["bookmarks", `Bookmarks (${Object.keys(bm).length})`]].map(([k, label]) => (
          <button key={k} onClick={() => setTab(k)} className={"px-4 py-2 rounded-lg text-sm font-medium " + (tab === k ? "bg-indigo-600 text-white" : "bg-slate-200 dark:bg-slate-700")}>{label}</button>
        ))}
      </nav>

      {tab === "explore" && err && <div className="p-3 rounded-lg bg-red-100 dark:bg-red-900/40 text-red-700 dark:text-red-200 text-sm">{err}</div>}
      {tab === "explore" && loading && <p className="text-sm text-slate-500">Loading repositories...</p>}
      {tab === "explore" && !loading && !err && <p className="text-sm text-slate-500">{res.total.toLocaleString()} repositories found</p>}
      {tab === "bookmarks" && !shown.length && <p className="text-sm text-slate-500">No bookmarks yet. Click ☆ on any repo.</p>}

      {shown.length > 0 && (
        <div className="grid gap-3 md:grid-cols-3">
          <ChartBox title="Languages" type="doughnut" labels={charts.langs[0]} data={charts.langs[1]} />
          <ChartBox title="Top by stars" type="bar" labels={charts.stars[0]} data={charts.stars[1]} />
          <ChartBox title="Open issues" type="bar" labels={charts.issues[0]} data={charts.issues[1]} />
        </div>
      )}

      <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
        {shown.map((r) => (
          <Card key={r.id} r={r} saved={!!bm[r.full_name]} note={bm[r.full_name]?.note || ""}
            onDetails={() => setDetail(r)} onToggle={() => toggle(r)} onNote={(n) => setNote(r.full_name, n)} onTopic={(t) => { setTopic(t); setTab("explore"); setPage(1); }} />
        ))}
      </div>

      {tab === "explore" && (
        <div className="flex items-center justify-center gap-3">
          <button disabled={page === 1} onClick={() => setPage(page - 1)} className="px-3 py-1 rounded bg-slate-200 dark:bg-slate-700 disabled:opacity-40">Prev</button>
          <span className="text-sm">Page {page}</span>
          <button disabled={res.items.length < 18} onClick={() => setPage(page + 1)} className="px-3 py-1 rounded bg-slate-200 dark:bg-slate-700 disabled:opacity-40">Next</button>
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
